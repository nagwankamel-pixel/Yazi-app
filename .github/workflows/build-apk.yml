name: Build YAZI APK

# Runs when you press "Run workflow" on the Actions tab, and on every push.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Backend API base URL'
        required: true
        default: 'https://api.yazi-app.com/api/v1'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.6'
          channel: stable

      # The handover zip was missing the Android manifest / MainActivity /
      # resource folders, so regenerate the standard Android scaffolding.
      # This only fills in what is absent; lib/, assets/ and pubspec are untouched.
      - name: Restore Android project files
        run: flutter create --platforms=android --project-name yozi_app --org com.yozi .

      # The backend is plain HTTP, which Android blocks by default.
      - name: Allow HTTP traffic to the API
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          grep -q 'usesCleartextTraffic' $MANIFEST || \
            sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"|' $MANIFEST
          sed -i 's|android:label="[^"]*"|android:label="YAZI"|' $MANIFEST
          cat $MANIFEST

      # "flutter create" above can overwrite the Gradle file, which would
      # silently drop the signing config and leave a build Play rejects.
      # Restore our own copy over whatever it wrote.
      - name: Restore the Yazi Gradle config
        run: |
          cp android/app/build.gradle.kts.yazi android/app/build.gradle.kts
          grep -q hasUploadKey android/app/build.gradle.kts && echo "signing config in place"

      # Firebase needs its Gradle plugin. Done here rather than in the repo
      # because "flutter create" above can rewrite the Gradle files.
      - name: Enable Firebase notifications
        run: |
          SET=android/settings.gradle.kts
          APP=android/app/build.gradle.kts
          if [ ! -f android/app/google-services.json ]; then
            echo "google-services.json missing — build would fail at runtime"; exit 1
          fi
          grep -q 'com.google.gms.google-services' $SET || \
            sed -i 's|id("com.android.application") version|id("com.google.gms.google-services") version "4.4.2" apply false\n    id("com.android.application") version|' $SET
          grep -q 'com.google.gms.google-services' $APP || \
            sed -i 's|id("dev.flutter.flutter-gradle-plugin")|id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")|' $APP
          # Firebase needs a slightly newer minimum Android version than the default.
          grep -q 'minSdk = 23' $APP || sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 23|' $APP
          echo "--- settings.gradle.kts ---"; sed -n '18,26p' $SET
          echo "--- app/build.gradle.kts ---"; sed -n '1,10p' $APP

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "icon generation skipped"

      - name: Analyze (warnings only, does not stop the build)
        run: flutter analyze || true

      # Google Play will not accept a debug-signed build. When the four
      # signing secrets exist in the repository, the release is signed with
      # the real upload key; without them the build still produces an APK you
      # can install yourself, just not one Play will take.
      - name: Set up signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "No signing secrets — building unsigned. Play will not accept this."
          else
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "Signing with the upload key."
          fi

      - name: Build app bundle for Play (.aab)
        if: steps.signing.outputs.signed == 'true'
        run: |
          flutter build appbundle --release \
            --dart-define=YAZI_API=${{ github.event.inputs.api_base || 'https://api.yazi-app.com/api/v1' }}

      - name: Build APK for installing directly
        run: |
          flutter build apk --release \
            --dart-define=YAZI_API=${{ github.event.inputs.api_base || 'https://api.yazi-app.com/api/v1' }}

      - name: Collect the files
        run: |
          mkdir -p out
          STAMP=$(date +%Y%m%d-%H%M)
          cp build/app/outputs/flutter-apk/app-release.apk "out/YAZI-$STAMP.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "out/YAZI-$STAMP.aab"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: YAZI-apk
          path: |
            out/*.apk
            out/*.aab
          retention-days: 30
